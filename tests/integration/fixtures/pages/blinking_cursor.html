<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 40px; font-family: Arial, sans-serif; background: #ffffff; }
  #field { font-size: 20px; }
  #cursor {
    display: inline-block;
    width: 2px;
    height: 22px;
    background: black;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <span id="field">Type here</span><span id="cursor"></span>
</body>
</html>
